[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-consensus-engine"
version = "0.1.0"
description = "Deterministic local consensus over independent agent answers"
requires-python = ">=3.10"

[project.scripts]
ace = "agent_consensus_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
